name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose --exit-code 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  # Fails PRs that change the automation itself, so they never auto-merge.
  # The owner reviews and merges those manually.
  protected-paths:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check for changes under .ai/ or .github/
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request; nothing to check."; exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -E '^\.(ai|github)/' || true)
          if [ -n "$changed" ]; then
            echo "::error::This PR changes protected paths and needs manual review by the owner:"
            echo "$changed"
            exit 1
          fi
          echo "No protected paths changed."
