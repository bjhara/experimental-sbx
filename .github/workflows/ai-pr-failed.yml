name: AI PR failed
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'ai/issue-')
    runs-on: ubuntu-24.04
    steps:
      - name: Mark the issue as failed
        env:
          GH_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          issue="${BRANCH#ai/issue-}"
          [[ "$issue" =~ ^[0-9]+$ ]] || { echo "Not an issue branch: $BRANCH"; exit 0; }
          failed=$(gh api "repos/$REPO/actions/runs/$CI_RUN_ID/jobs" --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(",")')
          if [[ ",$failed," == *",protected-paths,"* ]]; then
            note="The PR changes \`.ai/\` or \`.github/\`, so it needs manual review and merge by the owner."
          else
            note="Fix the failure, or re-apply \`ai-implement\` to let Claude try again on the same branch."
          fi
          gh issue edit "$issue" -R "$REPO" --remove-label ai-implemented --add-label ai-failed
          gh issue comment "$issue" -R "$REPO" --body "### 🤖 CI failed
          Failed checks: \`$failed\` on branch \`$BRANCH\` ([CI run]($CI_URL)).
          $note
          <!-- ai-pipeline:ci-failed run=$CI_RUN_ID -->"
